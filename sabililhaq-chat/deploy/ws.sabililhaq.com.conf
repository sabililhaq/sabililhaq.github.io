# /etc/nginx/sites-available/ws.sabililhaq.com.conf
#
# Rate-limit zones must be declared once in http{} scope (e.g. in
# /etc/nginx/nginx.conf or a conf.d snippet included at http level),
# then referenced here with `limit_req` / `limit_conn`.
#
# In nginx.conf http{} block, add:
#   limit_req_zone  $binary_remote_addr zone=chat_upgrade:10m rate=5r/s;
#   limit_conn_zone $binary_remote_addr zone=chat_conn:10m;

upstream chat_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name ws.sabililhaq.com;

    # ssl_certificate / ssl_certificate_key managed by certbot, as with
    # your other *.sabililhaq.com services.

    # Cap concurrent connections per IP so one client can't eat the
    # whole maxConnections budget in server.ts by itself.
    limit_conn chat_conn 10;

    # Throttle the rate of new upgrade/HTTP requests per IP (protects
    # against connect/reconnect flooding, not per-message flooding —
    # that's handled by the token bucket in the Node process).
    limit_req zone=chat_upgrade burst=10 nodelay;

    location /config {
        proxy_pass http://chat_backend;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://chat_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WS connections are long-lived; don't let nginx kill idle ones
        # early, but still bound it so dead TCP sessions eventually clear.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

server {
    listen 80;
    server_name ws.sabililhaq.com;
    return 301 https://$host$request_uri;
}
